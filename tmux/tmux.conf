set -g default-terminal "tmux-256color"
set -ga terminal-features "screen-256color:RGB"
set -gq allow-passthrough on
set -g focus-events on
set-option -g set-clipboard on
set -g visual-activity off
set -ga terminal-overrides ",*:RGB"
set -ga terminal-overrides ",*:Tc"
# set -as terminal-overrides ",xterm-256color:Tc"

set -g history-limit 50000

set -sg escape-time 0

# Easier and faster switching between next/prev window

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

set -g renumber-windows on

set -g status-position top 

set -g mode-keys vi

unbind C-b
set -g prefix C-a
bind C-a send-prefix


set -g status-fg '#ffffff'
# set -g status-bg '#000000'
set -g status-style "bg=default"
set -g window-status-current-style "fg=#ab4154 bold"
setw -g window-status-format "#I:#W"
setw -g window-status-current-format "#I:#W"

set -g mouse on

set-option -g status-justify absolute-centre

set -g status-interval 30
set-option -g status-left "[#{session_name}] "
set-option -g status-right "  #(pmset -g batt | awk -F '\t' 'NR==2 {match($2, /[0-9]+/); print substr($2, RSTART, RLENGTH)}')%%  %H:%M   "
# Navigate panes with vim-style keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6


# new
unbind v
bind v copy-mode


set-window-option -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel


# Resize panes with Alt + hjkl
bind -n M-h resize-pane -L 5
bind -n M-j resize-pane -D 5
bind -n M-k resize-pane -U 5
bind -n M-l resize-pane -R 5

bind r source-file "~/.config/tmux/tmux.conf"
bind o run-shell "tmux-sessionizer ~/.config"
bind n run-shell "tmux-sessionizer ~/personal/notes"
bind E show-environment -g

bind-key t display-popup -E -w 70% -h 95% -x 35 -y 30 "$SHELL"
bind-key g display-popup -E -w 90% -h 90% -x 10 -y 30 "lazygit"
