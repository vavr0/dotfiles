# reload config
bind=SUPER+SHIFT,r,reload_config

# layouts
bind=SUPER,n,switch_layout
bind=SUPER,m,setlayout,monocle
bind=SUPER,t,setlayout,tile
bind=SUPER,v,setlayout,vertical_tile
# bind=SUPER,v,setlayout,grid
bind=SUPER,i,setlayout,tgmix
bind=SUPER,s,setlayout,scroller

# ---- Audio controls ----
bind = NONE, XF86AudioRaiseVolume, spawn, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%+
bind = NONE, XF86AudioLowerVolume, spawn, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%-
# Mute toggle
bind = NONE, XF86AudioMute,        spawn, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle



# menu and terminal
bind=SUPER,Return,spawn,foot
# bind=SUPER,d,spawn,foot -T launcher -e fsel
bind=SUPER,d,spawn,rofi -config ~/.config/rofi/config.rasi -show drun
bind=SUPER,c,spawn_shell,cliphist list | rofi -dmenu -p "Clipboard " | cliphist decode | wl-copy
bind=SUPER+SHIFT,s,spawn_shell,bash ~/.config/mango/scripts/screenshot-rofi.sh
bind=SUPER,p,spawn_shell,bash ~/.config/mango/scripts/music-rofi.sh
# bind=Alt,space,spawn,fuzzel

# exit super+m
# bind=SUPER,code:58,quit
bind=SUPER+SHIFT,m,quit
# killclient super+q
# bind=ALT,code:24,killclient,
bind=SUPER,q,killclient,

# switch window focus
bind=ALT,Tab,focusstack,next
bind=SUPER,u,focuslast
# Focus windows (vim style)
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right

# swap window
# Swap (move) windows (vim style)
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right


# smartmovewin
bind=CTRL+SHIFT,Up,smartmovewin,up
bind=CTRL+SHIFT,Down,smartmovewin,down
bind=CTRL+SHIFT,Left,smartmovewin,left
bind=CTRL+SHIFT,Right,smartmovewin,right

# movewin
# bind=CTRL+SHIFT,Up,movewin,+0,-50
# bind=CTRL+SHIFT,Down,movewin,+0,+50
# bind=CTRL+SHIFT,Left,movewin,-50,+0
# bind=CTRL+SHIFT,Right,movewin,+50,+0


# smartresizewin
bind=CTRL+ALT,Up,smartresizewin,up
bind=CTRL+ALT,Down,smartresizewin,down
bind=CTRL+ALT,Left,smartresizewin,left
bind=CTRL+ALT,Right,smartresizewin,right

# resizewin
# bind=CTRL+ALT,Up,resizewin,+0,-50
# bind=CTRL+ALT,Down,resizewin,+0,+50
# bind=CTRL+ALT,Left,resizewin,-50,+0
# bind=CTRL+ALT,Right,resizewin,+50,+0
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# switch window status
# bind=SUPER,g,toggleglobal,
bind=SUPER,Tab,toggleoverview,
bind=SUPER,f,togglefloating,
# bind=SUPER,a,togglemaxmizescreen,
bind=SUPER+SHIFT,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
# bind=SUPER,i,minimized,
# bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,

# tile layout
bind=SUPER,o,incnmaster,1
bind=SUPER,y,incnmaster,-1
bind=CTRL+SUPER,h,setmfact,-0.05
bind=CTRL+SUPER,l,setmfact,+0.05
bind=CTRL+SUPER,k,setsmfact,-0.05
bind=CTRL+SUPER,j,setsmfact,+0.05
bind=ALT,s,zoom,


# tag switch
bind=SUPER,Left,viewtoleft,0
bind=CTRL,Left,viewtoleft_have_client,0
bind=SUPER,Right,viewtoright,0
bind=CTRL,Right,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

bind=SUPER,1,comboview,1
bind=SUPER,2,comboview,2
bind=SUPER,3,comboview,3
bind=SUPER,4,comboview,4
bind=SUPER,5,comboview,5
bind=SUPER,6,comboview,6
bind=SUPER,7,comboview,7
bind=SUPER,8,comboview,8
bind=SUPER,9,comboview,9

##move
bind=SUPER+shift,1,tag,1,0
bind=SUPER+shift,2,tag,2,0
bind=SUPER+shift,3,tag,3,0
bind=SUPER+shift,4,tag,4,0
bind=SUPER+shift,5,tag,5,0
bind=SUPER+shift,6,tag,6,0
bind=SUPER+shift,7,tag,7,0
bind=SUPER+shift,8,tag,8,0
bind=SUPER+shift,9,tag,9,0

bind=ctrl+Super,1,toggletag,1
bind=ctrl+Super,2,toggletag,2
bind=ctrl+Super,3,toggletag,3
bind=ctrl+Super,4,toggletag,4
bind=ctrl+Super,5,toggletag,5
bind=ctrl+Super,6,toggletag,6
bind=ctrl+Super,7,toggletag,7
bind=ctrl+Super,8,toggletag,8
bind=ctrl+Super,9,toggletag,9


# monitor switch
bind=alt+shift,h,focusmon,left
bind=alt+shift,l,focusmon,right
bind=alt+shift,k,focusmon,up
bind=alt+shift,j,focusmon,down
bind=SUPER+Alt,h,tagmon,left
bind=SUPER+Alt,l,tagmon,right
bind=SUPER+Alt,k,tagmon,up
bind=SUPER+Alt,j,tagmon,down

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=SUPER,a,togglegaps


#custom app bind
bind=SUPER,b,spawn,zen-browser
bind=SUPER+SHIFT,b,spawn,helium-browser --ozone-platform=x11


bind=SUPER,z,spawn, foot fsel
