# terminal = "foot"
# launcher = "rofi --show drun"
exec_once=~/.config/mango/autostart.sh
exec_once=mangobar

env=QT_STYLE_OVERRIDE,kvantum

# Effect
blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 3
blur_params_noise = 0.05
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 1
layer_shadows = 1
shadow_only_floating=1
shadows_size = 12
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadows_color= 0x000000ff

border_radius=6
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=0.88

# Animation Configuration
animations=0
layer_animations=0

animation_type_open=slide
animation_type_close=slide
layer_animation_type_open=slide
layer_animation_type_close=slide

animation_fade_in=1
animation_fade_out=1

tag_animation_direction=1

zoom_initial_ratio=1.0
zoom_end_ratio=1.0

fade_in_begin_opacity=0.85
fade_out_begin_opacity=0.95

animation_duration_move=90
animation_duration_open=140
animation_duration_tag=210
animation_duration_close=120

animation_curve_open=0.2,0.9,0.2,1.0
animation_curve_move=0.2,0.8,0.2,1.0
animation_curve_tag=0.2,0.85,0.2,1.0
animation_curve_close=0.3,0.0,0.2,1.0

# Scroller Layout Setting
scroller_structs=3
scroller_default_proportion=1
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=0
smart_gaps=0
default_master_factor=0.50
default_master_count=1

# Overview Setting
hotarea_size=10
enable_hotarea=0
overview_gap_inner=5
overview_gap_outer=30

# Misc
xwayland_persistence=1
sync_obj_enable=0
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_cross_tag=0
circle_layout=scroller
enable_floating_snap=1
snap_distance=50
cursor_theme=Bibata-Modern-Amber
cursor_size=22
cursor_hide_timeout=0
drag_tile_to_tile=0
single_scratchpad = 1

# keyboard
repeat_rate=25
repeat_delay=600
numlock_on=1
xkb_rules_layout=us,sk
# xkb_rules_options=ctrl:nocaps
# xkb_rules_options=grp:alt_altgr_toggle,caps:hyper

# Trackpad 
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
mouse_natural_scrolling=0
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1
mouse_accel_profile=0
mouse_accel_speed=-0.07
# scroll_button=274
# scroll_method=1

# Appearance
gap_inner_horizontal=6
gap_inner_vertical=6
gap_outer_horizontal=6
gap_outer_vertical=6
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=2
root_color=0x101010ff
border_color=0x403d52ff
focus_color=0xc4a7e7ff
maximized_screen_color=0x9a9a9aff
urgent_color=0xad401fff
scratchpad_color=0x6b6b6bff
global_color=0x5f5f5fff
overlay_color=0x7f7f7fff

# sub config load
# source=~/.config/mango/env.conf
source=~/.config/mango/binds.conf
# source=~/.config/mango/rule.conf
#
layer_rule=layer_name:selection,no_blur:1,no_animation:1,no_shadow:1
layer_rule=layer_name:launcher,no_blur:1

tag_rule=id:1,layout_name:scroller
tag_rule=id:2,layout_name:tile
tag_rule=id:3,layout_name:tile
tag_rule=id:4,layout_name:tile
tag_rule=id:5,layout_name:tile
tag_rule=id:6,layout_name:tile
tag_rule=id:7,layout_name:tile
tag_rule=id:8,layout_name:tile
tag_rule=id:9,layout_name:tile
