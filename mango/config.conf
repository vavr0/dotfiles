/017   thesis/
terminal = "foot"
launcher = "rofi --show drun"
exec-once=~/.config/mango/autostart.sh

env=QT_STYLE_OVERRIDE,kvantum

# Effect
blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 3
blur_params_noise = 0.05
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 1
layer_shadows = 1
shadow_only_floating=1
shadows_size = 12
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000ff

border_radius=6
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=0.88

# Animation Configuration
animations=0
layer_animations=0

animation_type_open=slide
animation_type_close=slide
layer_animation_type_open=slide
layer_animation_type_close=slide

animation_fade_in=1
animation_fade_out=1

tag_animation_direction=1

zoom_initial_ratio=1.0
zoom_end_ratio=1.0

fadein_begin_opacity=0.85
fadeout_begin_opacity=0.95

animation_duration_move=90
animation_duration_open=140
animation_duration_tag=210
animation_duration_close=120

animation_curve_open=0.2,0.9,0.2,1.0
animation_curve_move=0.2,0.8,0.2,1.0
animation_curve_tag=0.2,0.85,0.2,1.0
animation_curve_close=0.3,0.0,0.2,1.0

# Scroller Layout Setting
scroller_structs=3
scroller_default_proportion=1
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=0
smartgaps=0
default_mfact=0.50
default_smfact=0.50
default_nmaster=1

# Overview Setting
hotarea_size=10
enable_hotarea=0
ov_tab_mode=0
overviewgappi=5
overviewgappo=30

# Misc
xwayland_persistence=1
syncobj_enable=0
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
inhibit_regardless_of_visibility=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
circle_layout=spiral,scroller,master
enable_floating_snap=1
snap_distance=50
cursor_theme=Bibata-Modern-Amber
cursor_size=22
cursor_hide_timeout=0
drag_tile_to_tile=0
single_scratchpad = 1

# keyboard
repeat_rate=25
repeat_delay=600
numlockon=1
xkb_rules_layout=us,sk
# xkb_rules_options=ctrl:nocaps
# xkb_rules_options=grp:alt_altgr_toggle,caps:hyper

# Trackpad 
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
mouse_natural_scrolling=0
trackpad_natural_scrolling=0
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1
mouse_accel_profile=0
mouse_accel_speed=-0.07
# scroll_button=274
# scroll_method=1

# Appearance
gappih=6
gappiv=6
gappoh=6
gappov=6
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=2
rootcolor=0x101010ff
bordercolor=0x666666ff
focuscolor=0xdadadaff
maxmizescreencolor=0x9a9a9aff
urgentcolor=0xad401fff
scratchpadcolor=0x6b6b6bff
globalcolor=0x5f5f5fff
overlaycolor=0x7f7f7fff

# sub config load
# source=~/.config/mango/env.conf
source=~/.config/mango/binds.conf
# source=~/.config/mango/rule.conf
#
layerrule=layer_name:selection,noblur:1,noanim:1,noshadow:1

tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile
